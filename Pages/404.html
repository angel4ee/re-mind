<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RE-MIND - Page Not Found</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Literata (SemiBold 600) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,600&display=swap" rel="stylesheet">
  
  <style>
    /* GLOBAL LITERATA SEMIBOLD TYPOGRAPHY */
    body {
      font-family: 'Literata', Georgia, serif;
      font-weight: 600;
    }

    .font-serif-heading, 
    .font-sans-body {
      font-family: 'Literata', Georgia, serif;
    }

    /* --- ANIMATION STYLES --- */
    @keyframes heroFadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-hero-content {
      animation: heroFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-white text-gray-800 font-sans-body font-semibold antialiased min-h-screen flex items-center justify-center px-6 py-12">

  <div class="max-w-md w-full text-center animate-hero-content">
    
    <!-- Big 404 Orange Accent Indicator -->
    <div class="text-7xl md:text-8xl font-bold font-serif-heading text-[#D4A054] mb-4 tracking-wider">
      404
    </div>

    <div class="w-12 h-0.5 bg-[#D4A054] mx-auto mb-6"></div>

    <h1 class="text-2xl md:text-3xl font-semibold font-serif-heading text-gray-900 uppercase tracking-wide mb-3">
      PAGE NOT FOUND
    </h1>

    <p class="text-xs md:text-sm text-gray-600 leading-relaxed mb-8">
      Take a mindful breath. The page you are looking for might have been moved, renamed, or is temporarily unavailable.
    </p>

    <!-- Return Button in Orange -->
    <a href="index.html" 
       class="inline-block bg-[#D4A054] text-white text-xs uppercase tracking-widest px-8 py-3.5 rounded-sm hover:bg-[#c08d43] hover:shadow-lg hover:shadow-amber-500/20 hover:-translate-y-0.5 transition-all duration-300">
      RETURN TO HOMEPAGE
    </a>

  </div>

</body>
</html>
